name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test

      # ── Connector package ──

      - name: Connector — Typecheck
        run: npm run typecheck --workspace=packages/connector

      - name: Connector — Build
        run: npm run build --workspace=packages/connector

      - name: Connector — Tests
        run: npm test --workspace=packages/connector

  publish-check:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check CLI package
        run: npm pack --dry-run

      # The tests above run on the lockfile's dependency tree. This packs mn
      # with the shrinkwrap the release ships, installs it from a local
      # registry as a user's npm would, and checks the tree it gets: one copy
      # of each WASM package, the engine loading, a shielded address still
      # parsing, the MCP server's files present.
      - name: Check a fresh install
        run: node scripts/fresh-install-check.mjs

      - name: Connector — Build
        run: npm run build --workspace=packages/connector

      - name: Check Connector package
        run: npm pack --dry-run --workspace=packages/connector
